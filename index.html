<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>蜷川實花展｜置物盒鑰匙圈紀念品</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #ffd6e8, #f8a9cb, #c9e7ff);
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      color: #5a2340;
    }

    .card {
      width: min(92vw, 520px);
      padding: 28px;
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.78);
      box-shadow: 0 18px 50px rgba(174, 58, 113, 0.22);
      text-align: center;
      backdrop-filter: blur(10px);
    }

    img {
      width: 100%;
      border-radius: 22px;
      display: block;
      box-shadow: 0 10px 30px rgba(120, 40, 80, 0.18);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      letter-spacing: 0.08em;
      color: #d31f72;
    }

    p {
      margin: 0 0 22px;
      font-size: 16px;
      line-height: 1.7;
    }

    .date {
      margin-top: 18px;
      font-size: 14px;
      color: #8b5270;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>屬於我們的回憶</h1>
    <p>蜷川實花展 with EiM<br>彼岸之光・此岸之影</p>
    <img src="key.png" alt="展覽紀念品置物盒鑰匙圈">
    <div class="date">2026/04/19｜華山1914文創園區</div>
  </main>
</body>
</html>
